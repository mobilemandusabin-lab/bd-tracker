<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Logged Out State -->
  <div id="loggedOut" class="container" style="display:none;">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>BD Tracker</h1>
    </div>
    <p class="subtitle">Sign in to start tracking</p>
    <button id="loginBtn" class="btn btn-primary">Sign In</button>
  </div>

  <!-- Logged In State -->
  <div id="loggedIn" class="container" style="display:none;">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>BD Tracker</h1>
    </div>

    <div class="user-info">
      <div class="avatar" id="userAvatar">U</div>
      <div>
        <div class="user-name" id="userName">User</div>
        <div class="user-status">
          <span class="status-dot active"></span>
          <span id="userRole">Active</span>
        </div>
      </div>
    </div>

    <!-- Tab Navigation (My Stats only — Team tab removed) -->
    <div class="tabs">
      <button class="tab active" data-tab="myStats">My Stats</button>
    </div>

    <!-- My Stats Tab -->
    <div id="myStats" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="myListings">-</div>
          <div class="stat-label">Listings</div>
          <div class="stat-target" id="targetListings"></div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="mySpecs">-</div>
          <div class="stat-label">Spec Added</div>
          <div class="stat-target" id="targetSpecs"></div>
        </div>
        <div class="stat-card accent">
          <div class="stat-value" id="myQc">-</div>
          <div class="stat-label">QC Approved</div>
          <div class="stat-target" id="targetQc"></div>
        </div>
      </div>
    </div>

    <!-- Admin-only: Clear QC Pending -->
    <div id="qcPendingActions" class="qc-pending-actions" style="display:none;">
      <button id="clearQcPendingBtn" class="btn btn-danger btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Clear QC Pending
      </button>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Version</span>
        <span class="info-value" id="version">…</span>
      </div>
      <div class="info-item">
        <span class="info-label">Last Sync</span>
        <span class="info-value" id="lastSync">Never</span>
      </div>
    </div>

    <div id="updateBanner" class="update-banner" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y1="3"/>
      </svg>
      <div class="update-info">
        <span class="update-title">Update available: v<span id="latestVersion">…</span></span>
        <span class="update-changelog" id="updateChangelog"></span>
        <span class="update-hint">Re-install required for unpacked extensions — click to download.</span>
        <button id="installUpdateBtn" class="btn btn-primary btn-sm">Download v<span id="installUpdateVersion">…</span></button>
      </div>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none;">
      <span id="errorBannerText">Stats failed to load.</span>
    </div>
    </div>

    <div class="actions">
      <button id="syncBtn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Sync Now
      </button>
      <button id="logoutBtn" class="btn btn-ghost">Sign Out</button>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
