<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Logged Out State -->
  <div id="loggedOut" class="container" style="display:none;">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>BD Tracker</h1>
    </div>
    <p class="subtitle">Sign in to start tracking</p>
    <button id="loginBtn" class="btn btn-primary">Sign In</button>
  </div>

  <!-- Logged In State -->
  <div id="loggedIn" class="container" style="display:none;">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>BD Tracker</h1>
    </div>

    <div class="user-info">
      <div class="avatar" id="userAvatar">U</div>
      <div>
        <div class="user-name" id="userName">User</div>
        <div class="user-status">
          <span class="status-dot active"></span>
          <span id="userRole">Active</span>
        </div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab active" data-tab="myStats">My Stats</button>
      <button class="tab" data-tab="teamTab">Team</button>
    </div>

    <!-- My Stats Tab -->
    <div id="myStats" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="myListings">-</div>
          <div class="stat-label">Listings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="myProducts">-</div>
          <div class="stat-label">Products</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="myUpdates">-</div>
          <div class="stat-label">Updates</div>
        </div>
        <div class="stat-card accent">
          <div class="stat-value" id="myQc">-</div>
          <div class="stat-label">QC Approved</div>
        </div>
      </div>
      <div class="stat-total">
        <span>Total events today:</span>
        <span class="stat-total-value" id="myTotal">-</span>
      </div>
    </div>

    <!-- Team Tab -->
    <div id="teamTab" class="tab-content">
      <div id="teamLoading" class="loading">Loading team data...</div>
      <div id="teamList" class="team-list"></div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Version</span>
        <span class="info-value" id="version">1.0.0</span>
      </div>
      <div class="info-item">
        <span class="info-label">Last Sync</span>
        <span class="info-value" id="lastSync">Never</span>
      </div>
    </div>

    <div id="updateBanner" class="update-banner" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Update available: v<span id="latestVersion">1.0.0</span></span>
    </div>

    <div class="actions">
      <button id="syncBtn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Sync Now
      </button>
      <button id="logoutBtn" class="btn btn-ghost">Sign Out</button>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
